<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Pet Haven</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    body {
      background: linear-gradient(135deg, #0F766E 0%, #065F46 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .login-card {
      background: #FFFFFF;
      border-radius: var(--radius-xl);
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-lg);
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="text-center" style="margin-bottom: 2rem;">
      <a href="../index.html" class="brand-logo" style="justify-content: center; margin-bottom: 0.5rem;">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-5l6 2.5-6 2.5zm1-9.5c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
        <span>Pet Haven</span>
      </a>
      <h2 style="font-size: 1.5rem; font-weight: 800; color: #0F172A;">Admin Portal</h2>
      <p class="text-muted" style="font-size: 0.875rem;">Sign in to manage inventory & enquiries</p>
    </div>

    <form id="admin-login-form" style="display: flex; flex-direction: column; gap: 1.25rem;">
      <div class="form-group">
        <label class="form-label">Admin Email</label>
        <input type="email" id="login-email" class="form-input" required placeholder="admin@pethaven.com" value="admin@pethaven.com">
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="login-password" class="form-input" required placeholder="••••••••" value="admin123">
      </div>

      <button type="submit" class="btn btn-primary btn-full" style="min-height: 48px; font-size: 1rem; margin-top: 0.5rem;">
        Sign In to Dashboard
      </button>

      <div class="text-center" style="margin-top: 1rem;">
        <a href="../index.html" style="font-size: 0.85rem; color: var(--text-muted);">← Return to Store Front</a>
      </div>
    </form>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
